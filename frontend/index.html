<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudyTrack</title>
  <style>
    :root { --bg:#f6f5f1; --card:#fff; --texto:#1f2328; --suave:#6b7280; --borde:#e5e2da; --acento:#2f6f5e; --vencida:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--texto); }
    main { max-width: 760px; margin: 0 auto; padding: 16px; }
    h1 { margin: 8px 0 16px; } h2 { font-size: 1.05rem; margin: 0 0 10px; }
    section { background:var(--card); border:1px solid var(--borde); border-radius:10px; padding:14px; margin-bottom:14px; }
    form { display:grid; gap:8px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    input, select, textarea, button { font: inherit; padding:8px; border:1px solid var(--borde); border-radius:6px; }
    button { background:var(--acento); color:#fff; border:none; cursor:pointer; }
    button.secundario { background:transparent; color:var(--acento); border:1px solid var(--acento); }
    ul { list-style:none; padding:0; margin:0; }
    li { display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--borde); flex-wrap:wrap; }
    .punto { width:12px; height:12px; border-radius:50%; flex:none; }
    .vencida { color:var(--vencida); font-weight:600; }
    .completada { text-decoration: line-through; color:var(--suave); }
    .meta { color:var(--suave); font-size:.85rem; }
    .error { color:var(--vencida); font-size:.9rem; }
    .acciones { margin-left:auto; display:flex; gap:6px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
